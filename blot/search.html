</script>

<script>
(function(){
  var root=document.getElementById("global-search");
  var button=document.getElementById("nashp-search-trigger");
  var input=document.getElementById("gs-input");
  var results=document.getElementById("gs-results");
  if(!root||!button||!input||!results)return;

  var decoder=document.createElement("textarea");
  var posts=[];
  var loading;
  var masthead=document.getElementById('gs-masthead');
  var parked=[];
  function mountMasthead(){}
  function restoreMasthead(){
    parked.forEach(function(item){item.parent.insertBefore(item.node,item.next)});
    parked=[];
  }
  function loadPosts(){
    if(loading)return loading;
    loading=fetch('/search-data').then(function(response){
      if(!response.ok)throw new Error('Search unavailable');
      return response.text();
    }).then(function(html){
      var data=new DOMParser().parseFromString(html,'text/html').getElementById('post-data');
      posts=JSON.parse(data.textContent).filter(function(post){return post.url}).map(function(post){
        decoder.innerHTML=post.title||'';
        return {title:decoder.value,key:decoder.value.toLowerCase(),url:post.url};
      });
    }).catch(function(error){loading=null;throw error});
    return loading;
  }
  function updateResults(){
    var query=input.value.trim().toLowerCase();
    if(!query){results.replaceChildren();return}
    var matches=[];
    for(var i=0;i<posts.length&&matches.length<30;i++){
      if(posts[i].key.includes(query))matches.push(posts[i]);
    }
    render(matches);
  }

  function open(){
    loadPosts().then(updateResults).catch(function(){
      results.textContent='Search could not load. Type again to retry.';
    });
    mountMasthead();
    root.classList.remove("gs-hidden");
    document.body.classList.add("search-open");
    input.value="";
    results.replaceChildren();
    var now=new Date(); document.getElementById('gs-date').textContent=now.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}).toUpperCase();
    var activity=document.querySelector('.activity-summary,.activity-header,[data-activity]');
    var games=document.querySelectorAll('.currently-playing-latest li,.currently-playing-list li');
    var tags=document.querySelectorAll('.tag-all-tags a');
    document.getElementById('gs-activity').textContent=activity?activity.textContent.trim().replace(/\s+/g,' ').slice(0,34):'ACTIVE';
    document.getElementById('gs-games').textContent=games.length?[...games].slice(0,2).map(x=>x.textContent.trim()).join(' · ').slice(0,48):'GAME SIGNALS READY';
    document.getElementById('gs-tags').textContent=tags.length?[...tags].slice(0,4).map(x=>x.textContent.trim()).join(' · '):'TOPICS READY';
    var image=document.querySelector('.tag-activity-image img,.tag-issue-image-strip img');
    var visual=root.querySelector('.gs-visual');
    if(image&&!visual.firstChild){var copy=image.cloneNode();copy.alt='';copy.removeAttribute('loading');visual.appendChild(copy)}
    setTimeout(function(){input.focus()},0);
  }
  window.nashpOpenVisor=open;
  function close(){
    root.classList.add("gs-hidden");
    document.body.classList.remove("search-open");
    input.blur();
    restoreMasthead();
  }
  root.querySelector('.gs-close').addEventListener('click',close);
  function render(matches){
    results.replaceChildren();
    if(!matches.length){
      var empty=document.createElement("div");
      empty.className="gs-item";
      empty.textContent="No results";
      results.appendChild(empty);
      return;
    }
    matches.forEach(function(post){
      var item=document.createElement("a");
      item.className="gs-item";
      item.textContent=post.title;
      item.href=post.url;
      results.appendChild(item);
    });
  }

  document.body.append(button,root);
  button.addEventListener("click",open);
  root.addEventListener("click",function(event){if(event.target===root)close()});
  input.addEventListener("input",function(){
    loadPosts().then(updateResults).catch(function(){results.textContent='Search could not load. Type again to retry.'});
  });
  document.addEventListener("keydown",function(event){
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k"){
      event.preventDefault();
      open();
    }else if(event.key==="Escape"){
      close();
    }
  });
})();
</script>
